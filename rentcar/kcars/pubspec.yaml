  intl: ^0.20.2
dev_dependencies:
  auto_route_generator: ^10.2.3
  build_runner: ^2.5.0
  custom_lint: ^0.7.5
  dart_mappable_builder: ^4.5.0
  envied_generator: ^1.1.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.6
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/animations/
    - test/assets/
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: plus-jakarta
      fonts:
        # - asset: assets/fonts/plus-jakarta/URWThin.ttf
        #   weight: 100
        - asset: assets/fonts/plus-jakarta/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/plus-jakarta/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/plus-jakarta/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus-jakarta/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus-jakarta/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus-jakarta/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus-jakarta/PlusJakartaSans-ExtraBold.ttf
          weight: 800

    - family: urw
      fonts:
        - asset: assets/fonts/urw/URWThin.ttf
          weight: 100
        - asset: assets/fonts/urw/URWExtraLight.ttf
          weight: 200
        - asset: assets/fonts/urw/URWLight.ttf
          weight: 300
        - asset: assets/fonts/urw/URWRegular.ttf
          weight: 400
        - asset: assets/fonts/urw/URWMedium.ttf
          weight: 500
        - asset: assets/fonts/urw/URWSemiBold.ttf
          weight: 600
        - asset: assets/fonts/urw/URWBold.ttf
          weight: 700
        - asset: assets/fonts/urw/URWExtraBold.ttf
          weight: 800
        - asset: assets/fonts/urw/URWBlack.ttf
          weight: 900
