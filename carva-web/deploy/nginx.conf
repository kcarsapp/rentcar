# Nginx reverse proxy for Carva web.
# Put this in /etc/nginx/sites-available/carva-web and symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
# Get HTTPS with: certbot --nginx -d app.carvarent.com

server {
    listen 80;
    server_name app.carvarent.com;   # <-- change to your domain/subdomain

    # Optional: redirect to HTTPS once certbot is set up
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }

    client_max_body_size 12m;   # allow car/profile image uploads through the proxy
}
