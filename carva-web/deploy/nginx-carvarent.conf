# Nginx server block for carvarent.com
# Routes:
#   /api/v1/*  -> Express backend on 127.0.0.1:3000  (UNCHANGED — keep your API live)
#   everything else -> Next.js web app on 127.0.0.1:3001
#
# Install: put this in /etc/nginx/sites-available/carvarent.com, symlink into
# sites-enabled, test with `sudo nginx -t`, then `sudo systemctl reload nginx`.
# This REPLACES whatever currently serves the root of carvarent.com (the old
# marketing site). The API path is preserved, so app/clients keep working.

upstream carva_api  { server 127.0.0.1:3000; }
upstream carva_web  { server 127.0.0.1:3001; }

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name carvarent.com www.carvarent.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carvarent.com www.carvarent.com;

    # Existing Let's Encrypt certs (already issued for this domain).
    ssl_certificate     /etc/letsencrypt/live/carvarent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carvarent.com/privkey.pem;

    # Image uploads / multipart can be large; raise as needed.
    client_max_body_size 25m;

    # ── API: keep sending /api/v1 straight to the Express backend ──────────
    location /api/v1/ {
        proxy_pass http://carva_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js static build assets (long cache) ───────────────────────────
    location /_next/static/ {
        proxy_pass http://carva_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Everything else -> the Next.js app ─────────────────────────────────
    location / {
        proxy_pass http://carva_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
